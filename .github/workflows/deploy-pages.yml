name: Deploy Store Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # peaceiris publishes by pushing the gh-pages branch, which needs write
    # access to the repository contents, not just to Pages.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages serves CSS and JS with a four-hour cache but HTML with ten
      # minutes, so unversioned asset URLs leave browsers running old code
      # against a fresh page. Stamping the commit into them closes that gap.
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # provide CNAME file in repo (already present)
