name: Deploy Store Pages

# Publication happens here, in the repository -- not by pushing a branch that a
# platform setting then serves (standards/DEPLOYMENT.md). The build alone was
# never the issue; publication was, because a setting decided what reached users.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages serves CSS and JS with a four-hour cache but HTML with ten
      # minutes, so unversioned asset URLs leave browsers running old code
      # against a fresh page. Stamping the commit into them closes that gap.
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
