name: Mobile CI

# Lint, test and build a debug APK for every change to the Store app itself,
# separate from Publish to Store (which builds the signed release and only
# runs on demand). Mirrors ReWeb's own Build workflow.

on:
  push:
    branches: [main, development, runway]
    paths:
      - "mobile/**"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    name: Lint, test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default ('tools platform-tools'): Google has
          # removed the legacy 'tools' package from the SDK repository, so the
          # default install now fails outright. Gradle only needs platform-tools.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          build-root-directory: mobile

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report APK size
        run: ./gradlew reportApkSize --no-daemon

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was produced under app/build/outputs/apk/debug"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/store-debug.apk
          echo "apk_path=mobile/artifacts/store-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: store-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-mobile-reports
          path: |
            mobile/app/build/reports/lint-results-debug.html
            mobile/app/build/reports/tests/testDebugUnitTest/
            mobile/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
