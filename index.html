<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Store is where every app built on the Harith Kavish ecosystem is packaged, versioned, and ready to install.">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)">
    <meta property="og:site_name" content="Harith Kavish">
    <meta property="og:title" content="Store">
    <meta property="og:description" content="Every app built on the Harith Kavish ecosystem, packaged and ready to install.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://store.harithkavish.com/">
    <meta property="og:image" content="https://store.harithkavish.com/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Store">
    <meta name="twitter:description" content="Every app built on the Harith Kavish ecosystem, packaged and ready to install.">
    <meta name="twitter:image" content="https://store.harithkavish.com/logo.png">
    <link rel="canonical" href="https://store.harithkavish.com/">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Shared theme from the main site, so the store follows it automatically. -->
    <link rel="stylesheet" href="https://harithkavish.com/style.css">
    <link rel="stylesheet" href="/store.css">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('harithkavish-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <title>Store — Harith Kavish</title>
</head>
<body data-page="store">
    <div class="site-shell">
        <header class="site-header">
            <div class="site-header__inner">
                <a class="brand" href="/">
                    <img class="brand__mark" src="/logo.png" alt="" aria-hidden="true">
                    <span class="brand__text">
                        <span class="brand__name">Harith Kavish</span>
                        <span class="brand__descriptor">Store</span>
                    </span>
                </a>
                <div class="site-header__actions">
                    <nav class="site-nav" aria-label="Primary">
                        <a class="site-nav__link" href="https://harithkavish.com/">Home</a>
                        <a class="site-nav__link" href="https://nexus.harithkavish.com/">Nexus</a>
                    </nav>
                    <button type="button" class="theme-toggle" data-theme-toggle="true" aria-label="Switch to dark mode">Dark mode</button>
                </div>
            </div>
        </header>

        <main class="site-main" id="store-root" aria-live="polite">
            <p class="store-loading">Loading the catalog…</p>
        </main>

        <footer class="site-footer">
            <div class="site-footer__inner">
                <p class="site-footer__copy">© <span data-year>2026</span> Harith Kavish</p>
                <nav class="site-footer__nav" aria-label="Footer">
                    <a class="site-nav__link" href="https://harithkavish.com/">Home</a>
                    <a class="site-nav__link" href="https://nexus.harithkavish.com/">Nexus</a>
                    <a class="site-nav__link" href="https://harithkavish.com/status.html">Status</a>
                    <a class="site-nav__link" href="https://harithkavish.com/legal.html">Legal</a>
                </nav>
            </div>
        </footer>
    </div>

    <script src="/store.js"></script>
</body>
</html>
